<svg xmlns="http://www.w3.org/2000/svg" width="900" height="404" viewBox="0 0 900 404" font-family="&#x27;MesloLGS Nerd Font Mono&#x27;,&#x27;JetBrainsMono NF&#x27;,&#x27;JetBrainsMono Nerd Font Mono&#x27;,&#x27;JetBrainsMonoNL Nerd Font Mono&#x27;,&#x27;FiraCode Nerd Font Mono&#x27;,&#x27;FiraCode Nerd Font&#x27;,ui-monospace,&#x27;SF Mono&#x27;,Menlo,&#x27;Cascadia Mono&#x27;,Consolas,&#x27;DejaVu Sans Mono&#x27;,&#x27;Liberation Mono&#x27;,monospace"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#C800DF"/><stop offset="1" stop-color="#E60076"/></linearGradient></defs><rect x="1" y="1" width="898" height="402" rx="14" fill="#0C0C0F" stroke="#2A2A33" stroke-width="2"/><rect x="1" y="1" width="898" height="4" rx="2" fill="url(#g)"/><text x="28" y="40" font-size="15" font-weight="700" fill="#C800DF" text-anchor="start">$ </text><text x="46" y="40" font-size="15" font-weight="700" fill="#F3F4F6" text-anchor="start">cat about.md</text><text x="28" y="78" font-size="14" font-weight="400" fill="#F3F4F6" text-anchor="start">Principal Reliability Engineer and CISSP. A decade leading SRE and reliability</text><text x="28" y="100" font-size="14" font-weight="400" fill="#F3F4F6" text-anchor="start">teams through high-stakes incidents where lives and billions of dollars were on</text><text x="28" y="122" font-size="14" font-weight="400" fill="#F3F4F6" text-anchor="start">the line. Security isn&#x27;t a bolt-on for me; it&#x27;s how I build.</text><text x="28" y="166" font-size="14" font-weight="400" fill="#F3F4F6" text-anchor="start">Four years deep in AI and LLMs. I built Duke Energy&#x27;s in-house AI SRE Risk</text><text x="28" y="188" font-size="14" font-weight="400" fill="#F3F4F6" text-anchor="start">Platform, and I&#x27;ve taken companies from thousands of alerts a month to single</text><text x="28" y="210" font-size="14" font-weight="400" fill="#F3F4F6" text-anchor="start">digits. An early adopter of GitOps and FinOps, I believe there&#x27;s a 10x win hiding</text><text x="28" y="232" font-size="14" font-weight="400" fill="#F3F4F6" text-anchor="start">in nearly every system that isn&#x27;t yet using automation and AI.</text><text x="28" y="276" font-size="14" font-weight="400" fill="#F3F4F6" text-anchor="start">K.I.S.S., always. Mentorship means teaching people to fish, and the engineers</text><text x="28" y="298" font-size="14" font-weight="400" fill="#F3F4F6" text-anchor="start">I&#x27;ve mentored have gone further than they imagined.</text><text x="28" y="342" font-size="14" font-weight="400" fill="#F3F4F6" text-anchor="start">20+ years hands-on with AWS, GCP, Kubernetes and Terraform.</text><svg x="28" y="361" width="16" height="16" viewBox="0 0 24 24" style="color:#C800DF"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></g></svg><text x="52" y="374" font-size="13" font-weight="400" fill="#9CA3AF" text-anchor="start">Charlotte, NC · remote</text><svg x="253.6" y="361" width="16" height="16" viewBox="0 0 24 24" style="color:#C800DF"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M10 12h4m-4-4h4m0 13v-3a2 2 0 0 0-4 0v3"/><path d="M6 10H4a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2"/><path d="M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16"/></g></svg><text x="277.6" y="374" font-size="13" font-weight="400" fill="#9CA3AF" text-anchor="start">secunit, llc</text><svg x="401.2" y="361" width="16" height="16" viewBox="0 0 24 24" style="color:#C800DF"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12l2 2l4-4"/></g></svg><text x="425.2" y="374" font-size="13" font-weight="400" fill="#9CA3AF" text-anchor="start">CISSP since 2017</text><svg x="580.0" y="361" width="16" height="16" viewBox="0 0 24 24" style="color:#C800DF"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20a14.5 14.5 0 0 0 0-20M2 12h20"/></g></svg><text x="604.0" y="374" font-size="13" font-weight="400" fill="#9CA3AF" text-anchor="start">secunit.io</text></svg>
<?xml version="1.0" encoding="UTF-8"?>
<!-- ==========================================================================
  GITHUB PROFILE ABOUT CARD (assets/about.svg)
  ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  Description: Sanitizer-safe GitHub profile card matched to #16161D / #C800DF
  Warning: ANY SENSITIVE DATA LIKE SECRETS KEYS OR TOKENS GO INTO API_KEYS.ZSH
  Created: 2026-11-19
  Platform: Cross-Platform
  Owner: Matthew Evans
=========================================================================== -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 472" width="880" height="472">
  <defs>
    <linearGradient id="top-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9e00b3"/>
      <stop offset="50%" stop-color="#C800DF"/>
      <stop offset="100%" stop-color="#8a00c2"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect x="0.5" y="0.5" width="879" height="471" rx="12" ry="12" fill="#16161D" stroke="#282834" stroke-width="1"/>

  <!-- Top Magenta Accent Bar -->
  <rect x="12" y="1" width="856" height="3.5" rx="1.75" fill="url(#top-accent)"/>

  <!-- Header -->
  <text x="34" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#f4f4f6" letter-spacing="0.3">
    Rogue SecUnit <tspan fill="#C800DF">//</tspan> Principal SRE &amp; Infrastructure Architect
  </text>

  <!-- Paragraph 1 -->
  <text x="34" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#d4d4dc">
    <tspan x="34" dy="0">Thirty-five years deep in packets, kernels, and production uptime (est. 1991). Following an early encounter</tspan>
    <tspan x="34" dy="21">with a local university&#8217;s dial-in modem bank</tspan><tspan dy="-5" font-size="10" font-weight="700" fill="#C800DF">1</tspan><tspan dy="5">, I was fortunate to learn at a very young age that security</tspan>
    <tspan x="34" dy="21">cannot be an afterthought&#8212;it has to be an equal partner in every solution throughout its entire lifecycle.</tspan>
    <tspan x="34" dy="21">Relying on &#8220;security through obscurity&#8221; is a gamble, and assuming you&#8217;re too small a fish to be noticed in</tspan>
    <tspan x="34" dy="21">a big ocean is how you get compromised.</tspan>
  </text>

  <!-- Paragraph 2 -->
  <text x="34" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#d4d4dc">
    <tspan x="34" dy="0">Through </tspan><tspan font-weight="700" fill="#ffffff">secunit, llc</tspan><tspan>, I help enterprise teams eliminate single points of failure, automate zero-trust</tspan>
    <tspan x="34" dy="21">workflows, and keep large-scale cloud and Linux infrastructure from catching fire. Off the clock, I live</tspan>
    <tspan x="34" dy="21">on the bleeding edge of technology to stay sharp&#8212;what is bleeding edge today becomes commonplace tomorrow.</tspan>
    <tspan x="34" dy="21">That obsession has evolved into writing tooling in </tspan><tspan font-weight="700" fill="#ffffff">Rust</tspan><tspan>, </tspan><tspan font-weight="700" fill="#ffffff">Go</tspan><tspan>, and </tspan><tspan font-weight="700" fill="#ffffff">TypeScript</tspan><tspan>, routing local LLMs on Apple</tspan>
    <tspan x="34" dy="21">Silicon, and running a global quad-WAN homelab with a </tspan><tspan font-weight="700" fill="#ffffff">25GbE</tspan><tspan> </tspan><tspan font-style="italic">&#8220;on-home-prem&#8221;</tspan><tspan> core pushing </tspan><tspan font-weight="700" fill="#22c55e">7Gbps &#9660;</tspan><tspan fill="#d4d4dc"> / </tspan><tspan font-weight="700" fill="#ef4444">6Gbps &#9650;</tspan>
    <tspan x="34" dy="21" fill="#d4d4dc">across fiber &#9889;, cable &#128268;, Starlink satellite &#128752;, and 5G UWB &#128225;.</tspan>
  </text>

  <!-- Metadata Bar -->
  <line x1="34" y1="324" x2="846" y2="324" stroke="#262632" stroke-width="1"/>

  <!-- 1. Location Pin -->
  <g transform="translate(34, 338)">
    <path d="M8 1C4.96 1 2.5 3.46 2.5 6.5c0 4.12 5.5 9.5 5.5 9.5s5.5-5.38 5.5-9.5C13.5 3.46 11.04 1 8 1zm0 7.5a2 2 0 1 1 0-4 2 2 0 0 1 0 4z" fill="none" stroke="#C800DF" stroke-width="1.4"/>
    <text x="22" y="13" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" fill="#e4e4ec">CLT</text>
  </g>

  <!-- 2. Company Building -->
  <g transform="translate(220, 338)">
    <path d="M2 15h12M3 15V3a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v12M10 7h2a1 1 0 0 1 1 1v7M5.5 5h1.5M5.5 8h1.5M5.5 11h1.5" fill="none" stroke="#C800DF" stroke-width="1.4" stroke-linecap="round"/>
    <text x="22" y="13" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" fill="#e4e4ec">secunit, llc</text>
  </g>

  <!-- 3. CISSP Shield -->
  <g transform="translate(430, 338)">
    <path d="M8 1.5L2.5 4v4.2c0 3.7 2.35 7.1 5.5 8.3 3.15-1.2 5.5-4.6 5.5-8.3V4L8 1.5zm-2.2 6.8l1.6 1.6 3-3.2" fill="none" stroke="#C800DF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="22" y="13" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" fill="#e4e4ec">ISC2 CISSP</text>
  </g>

  <!-- 4. Website Globe -->
  <g transform="translate(640, 338)">
    <circle cx="8" cy="8.5" r="6.5" fill="none" stroke="#C800DF" stroke-width="1.4"/>
    <ellipse cx="8" cy="8.5" rx="3" ry="6.5" fill="none" stroke="#C800DF" stroke-width="1.3"/>
    <line x1="1.5" y1="8.5" x2="14.5" y2="8.5" stroke="#C800DF" stroke-width="1.3"/>
    <text x="22" y="13" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" fill="#e4e4ec">secunit.io</text>
  </g>

  <!-- Footnote Divider -->
  <line x1="34" y1="370" x2="846" y2="370" stroke="#262632" stroke-width="1"/>

  <!-- Footnote 1 -->
  <text x="34" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.2" font-style="italic" fill="#9ca3af">
    <tspan x="34" dy="0" font-style="normal" font-weight="700" fill="#C800DF">1 </tspan><tspan>As a curious ten-year-old in the nostalgic days of BBSes, an overnight war-dialing session discovered a local university&#8217;s</tspan>
    <tspan x="34" dy="16">dial-in bank. The owner of the network relied on security-through-obscurity as their sole defensive measure, which JtR tore</tspan>
    <tspan x="34" dy="16">through in about 15 minutes. The owner had renamed a guest account but left it passwordless, which I was able to leverage</tspan>
    <tspan x="34" dy="16">into a privilege escalation attack with a little help from a password file, John the Ripper, and the laziness of the network</tspan>
    <tspan x="34" dy="16">owner, who chose a root password of </tspan><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-style="normal" fill="#d4d4dc">frisbee</tspan><tspan>.</tspan>
  </text>
</svg>
